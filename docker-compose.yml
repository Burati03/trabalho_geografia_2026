services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: biomas, POSTGRES_PASSWORD: biomas, POSTGRES_DB: biomas }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biomas"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgresql://biomas:biomas@db:5432/biomas" }
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
